<!DOCTYPE html>
<html lang="hr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kontakt | Automehanika Prijić</title>

    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: {
                        sans: ['Roboto', 'sans-serif'],
                        display: ['Montserrat', 'sans-serif'],
                    },
                },
            },
        }
    </script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700;800&family=Roboto:wght@400;500;700&display=swap" rel="stylesheet">
</head>
<body class="bg-gray-100 text-gray-800 font-sans">

    <header class="sticky top-0 z-10 bg-white border-b border-gray-200 shadow-sm">
        <div class="max-w-5xl mx-auto px-4 py-4 flex flex-wrap items-center justify-between gap-x-6 gap-y-2">
            <a href="index.html" class="flex items-center gap-2 font-display text-xl font-extrabold tracking-tight text-red-700 hover:text-red-800">
                <img src="slike/logo.svg" alt="" class="w-8 h-8">
                Automehanika Prijić
            </a>
            <nav class="flex gap-6 items-center">
                <a href="index.html" class="font-medium hover:text-red-700">Naslovnica</a>
                <a href="usluge.html" class="font-medium hover:text-red-700">Usluge</a>
                <a href="kontakt.html" class="text-red-700 font-medium hover:text-red-800">Kontakt</a>
            </nav>
        </div>
    </header>

    <main class="max-w-2xl mx-auto px-4 py-12">
        <h1 class="font-display text-3xl md:text-4xl font-extrabold mb-4 text-slate-900">Kontakt</h1>
        <p class="text-gray-600 mb-8">
            Ispunite obrazac i javit ćemo Vam se u roku od jednog radnog dana s prijedlogom termina.
        </p>

        <form class="bg-white border border-gray-200 rounded-lg p-6 shadow-sm flex flex-col gap-4">

            <div class="flex flex-col md:flex-row gap-4">
                <div class="flex flex-col gap-1 w-full">
                    <label for="name" class="font-display text-sm font-medium text-slate-700">Ime i prezime</label>
                    <input type="text" id="name" name="name" required
                        class="border border-gray-300 rounded-md px-3 py-2 focus:outline-none focus:border-red-600 focus:ring-2 focus:ring-red-600">
                </div>

                <div class="flex flex-col gap-1 w-full">
                    <label for="email" class="font-display text-sm font-medium text-slate-700">E-mail adresa</label>
                    <input type="email" id="email" name="email" required
                        class="border border-gray-300 rounded-md px-3 py-2 focus:outline-none focus:border-red-600 focus:ring-2 focus:ring-red-600">
                </div>
            </div>

            <div class="flex flex-col gap-1">
                <label for="message" class="font-display text-sm font-medium text-slate-700">Koji servis Vas zanima?</label>
                <textarea id="message" name="message" rows="4"
                    class="border border-gray-300 rounded-md px-3 py-2 focus:outline-none focus:border-red-600 focus:ring-2 focus:ring-red-600"></textarea>
            </div>

            <button type="submit"
                class="bg-red-700 text-white font-semibold px-6 py-3 rounded-lg hover:bg-red-800 transition-colors duration-200">
                Pošalji zahtjev
            </button>
        </form>
    </main>

    <footer class="bg-slate-900 text-slate-300">
        <div class="max-w-5xl mx-auto px-4 py-8 flex flex-col md:flex-row justify-between gap-4 text-sm">
            <p>Automehanika Prijić, Hrvatske državnosti 28, Koprivnica</p>
            <p>Ponedjeljak – subota, 8:00 – 18:00</p>
        </div>
    </footer>
</body>
</html>
